services:
  migrate:
    build:
      context: .
      target: migrator
    env_file: .env
    environment:
      NODE_ENV: production
    volumes:
      - shiftlog-data:/app/data
    restart: "no"

  shiftlog:
    build:
      context: .
      target: runner
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - shiftlog-data:/app/data
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  shiftlog-data:
